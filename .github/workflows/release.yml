name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test -c Release

      - name: Package
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet publish src/Jellyfin.Plugin.XRay -c Release -o publish \
            -p:Version="$VERSION" -p:AssemblyVersion="$VERSION" -p:FileVersion="$VERSION"
          ZIP="xray_${VERSION}.zip"
          (cd publish && zip -j "../$ZIP" *.dll)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "checksum=$(md5sum "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.zip }}" \
            --title "X-Ray ${{ steps.package.outputs.version }}" \
            --notes "$(python3 scripts/update_manifest.py changelog)"

      - name: Add version to manifest.json
        run: |
          git fetch origin main
          git checkout main
          python3 scripts/update_manifest.py add \
            --version "${{ steps.package.outputs.version }}" \
            --checksum "${{ steps.package.outputs.checksum }}" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${{ steps.package.outputs.zip }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Add ${{ steps.package.outputs.version }} to plugin repository manifest"
          git push origin main
